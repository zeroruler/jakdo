<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작도실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: drafting desk — the white sheet sits on a gridded desk on the left; a narrow instrument panel on the right (stacks below on phones). */
:root {
  --desk: #EEF1F5;
  --desk-grid: #DDE3EB;
  --panel: #FFFFFF;
  --ink: #18202B;
  --muted: #5E6878;
  --rule: #D5DBE3;
  --blue: #2A62D6;      /* drafting blue: construction lines, focus, primary */
  --blue-ink: #FFFFFF;
  --mark: #D9482B;      /* centre marks */
  --chip: #F3F5F8;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #12161C; --desk-grid: #1C222B; --panel: #181D24; --ink: #E7EBF1; --muted: #9AA4B3;
    --rule: #2A313C; --blue: #6E9BFF; --blue-ink: #0D1320; --mark: #FF7A5C; --chip: #212833;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #12161C; --desk-grid: #1C222B; --panel: #181D24; --ink: #E7EBF1; --muted: #9AA4B3;
  --rule: #2A313C; --blue: #6E9BFF; --blue-ink: #0D1320; --mark: #FF7A5C; --chip: #212833;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--desk); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
h1 span { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0.06em; margin-left: 6px; }
header p { margin: 0; color: var(--muted); max-width: 60ch; text-wrap: balance; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

.desk {
  position: relative; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden;
  height: clamp(340px, 68vh, 720px);
  background-color: var(--desk);
  background-image:
    linear-gradient(var(--desk-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--desk-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  display: grid; place-items: center; padding: 18px;
}
@media (max-width: 860px) { .desk { height: auto; aspect-ratio: 1 / 1; max-width: 100%; padding: 12px; } }
.desk.drag { outline: 2px dashed var(--blue); outline-offset: -8px; }
#sheet { width: 100%; height: 100%; display: block; }
.desk .ticker {
  position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted);
  letter-spacing: 0.04em; font-variant-numeric: tabular-nums; background: var(--desk); padding: 2px 6px; border-radius: 3px;
}
.desk .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; }
.desk .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s linear; }

aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; display: grid; }
.sec { padding: 14px 16px; display: grid; gap: 10px; border-top: 1px solid var(--rule); }
.sec:first-child { border-top: 0; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.label b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  font: 500 14px/1 var(--sans); padding: 10px 14px; border-radius: 5px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); flex: 1; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:focus-visible, .chip:focus-within, input[type=range]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; }
.grow { flex: 1; }

.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 99px;
  background: var(--chip); border: 1px solid var(--rule); color: var(--muted); font-size: 13px;
}
.chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.chip svg { width: 13px; height: 13px; }

input[type=range] { width: 100%; accent-color: var(--blue); }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; }
.toggle input { accent-color: var(--blue); width: 16px; height: 16px; margin: 0; }

.orig { display: flex; gap: 12px; align-items: center; }
.orig canvas { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; border: 1px solid var(--rule); background: var(--chip); }
.orig p { margin: 0; color: var(--muted); font-size: 13px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }

.overlay {
  position: fixed; inset: 0; background: rgba(10, 14, 20, .72); display: grid; place-items: center; z-index: 20;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.overlay .card { background: var(--panel); color: var(--ink); border-radius: 8px; padding: 14px; display: grid; gap: 10px; max-width: min(560px, 100%); max-height: 100%; overflow: auto; }
.overlay img { width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
.overlay p { margin: 0; color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 5px; font-size: 13px; z-index: 30; }
@media (prefers-reduced-motion: reduce) { .desk .bar i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>작도실<span>JAKDO</span></h1>
    <p>사진을 원, 삼각형, 사각형만으로 다시 그립니다. 도형마다 작도선이 먼저 그어지고 면이 채워져요.</p>
  </header>

  <div class="main">
    <section class="desk" id="desk" aria-label="도면">
      <svg id="sheet" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="기하학 드로잉">
        <rect id="paper" x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
        <g id="fills"></g>
        <g id="guides"></g>
        <rect id="frame" x="0" y="0" width="200" height="200" fill="none" stroke="#C9D1DC" stroke-width="0.4"/>
      </svg>
      <div class="ticker" id="ticker">준비</div>
      <div class="bar"><i id="barI"></i></div>
    </section>

    <aside>
      <div class="sec">
        <div class="row">
          <label class="btn primary" for="file">사진 올리기</label>
          <input id="file" type="file" accept="image/*" hidden>
          <button class="btn" id="sampleBtn" type="button">예시</button>
        </div>
        <div class="orig">
          <canvas id="thumb" width="128" height="128" aria-label="원본"></canvas>
          <p id="origNote">예시 이미지로 그리는 중이에요. 사진을 올리거나 이 칸에 끌어다 놓으세요.</p>
        </div>
      </div>


      <div class="sec">
        <div class="label">도형</div>
        <div class="row" id="types">
          <label class="chip"><input type="checkbox" id="tCircle" value="circle" checked><span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>원</span></label>
          <label class="chip"><input type="checkbox" id="tTri" value="tri" checked><span><svg viewBox="0 0 14 14"><path d="M7 1.8 12.8 12H1.2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>삼각형</span></label>
          <label class="chip"><input type="checkbox" id="tRect" value="rect"><span><svg viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>사각형</span></label>
        </div>
      </div>

      <div class="sec">
        <div class="label">스타일</div>
        <div class="row" id="styles">
          <label class="chip"><input type="radio" name="style" id="sColor" value="color" checked><span>컬러</span></label>
          <label class="chip"><input type="radio" name="style" id="sInk" value="ink"><span>먹</span></label>
          <label class="chip"><input type="radio" name="style" id="sLine" value="line"><span>선화</span></label>
        </div>
      </div>

      <div class="sec">
        <label class="label" for="count">도형 수 <b id="countV">1400</b></label>
        <input type="range" id="count" min="60" max="2000" step="20" value="1400">
        <label class="label" for="speed">그리는 속도 <b id="speedV">보통</b></label>
        <input type="range" id="speed" min="1" max="5" step="1" value="3">
        <label class="toggle"><input type="checkbox" id="keepGuides" checked> 작도선 남기기</label>
      </div>

      <div class="sec">
        <div class="row">
          <button class="btn grow" id="replayBtn" type="button">다시 그리기</button>
          <button class="btn grow" id="saveBtn" type="button">이미지 저장</button>
        </div>
        <button class="btn" id="copyBtn" type="button">SVG 코드 복사</button>
        <p class="note">계산은 모두 이 브라우저 안에서 해요. 사진은 어디에도 올라가지 않아요.</p>
      </div>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <img id="outImg" alt="완성된 기하학 드로잉">
    <p>이미지를 길게 누르거나(휴대폰) 우클릭해서(PC) 저장하세요.</p>
    <button class="btn" id="closeOv" type="button">닫기</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script id="workerSrc" type="text/plain">
let W, H, T, C, A, TYPES, GRAY;
const B = 6; let BW, BH, CDF, BCOUNT = 0;
function buildErrorMap() {
  BW = Math.ceil(W / B); BH = Math.ceil(H / B); BCOUNT = BW * BH;
  const e = new Float64Array(BCOUNT);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, t = i * 4, c = i * 3;
    const d0 = T[t] - C[c], d1 = T[t + 1] - C[c + 1], d2 = T[t + 2] - C[c + 2];
    e[((y / B) | 0) * BW + ((x / B) | 0)] += d0 * d0 + d1 * d1 + d2 * d2;
  }
  CDF = new Float64Array(BCOUNT); let acc = 0;
  for (let i = 0; i < BCOUNT; i++) { acc += Math.pow(e[i], 0.75) + 1; CDF[i] = acc; }
}
function samplePos() {
  const r = rnd() * CDF[BCOUNT - 1]; let lo = 0, hi = BCOUNT - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (CDF[m] < r) lo = m + 1; else hi = m; }
  return [Math.min(W - 0.01, (lo % BW + rnd()) * B), Math.min(H - 0.01, (((lo / BW) | 0) + rnd()) * B)];
}
const L = new Int32Array(3 * 2048);
const rnd = Math.random;
const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;

function scanCircle(s) {
  let n = 0; const r = s.r;
  const y0 = Math.max(0, Math.ceil(s.y - r)), y1 = Math.min(H - 1, Math.floor(s.y + r));
  for (let y = y0; y <= y1; y++) {
    const dy = y - s.y, dx = Math.sqrt(Math.max(0, r * r - dy * dy));
    const x1 = Math.max(0, Math.ceil(s.x - dx)), x2 = Math.min(W - 1, Math.floor(s.x + dx));
    if (x2 >= x1) { L[n++] = y; L[n++] = x1; L[n++] = x2; }
  }
  return n;
}
function pts(s) {
  if (s.t === 'tri') return s.p;
  const c = Math.cos(s.a), si = Math.sin(s.a), hw = s.w / 2, hh = s.h / 2, out = [];
  for (const [u, v] of [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]) out.push(s.x + u * c - v * si, s.y + u * si + v * c);
  return out;
}
function scanPoly(p) {
  let n = 0, ymin = Infinity, ymax = -Infinity; const k = p.length;
  for (let i = 1; i < k; i += 2) { if (p[i] < ymin) ymin = p[i]; if (p[i] > ymax) ymax = p[i]; }
  const y0 = Math.max(0, Math.ceil(ymin)), y1 = Math.min(H - 1, Math.floor(ymax));
  for (let y = y0; y <= y1; y++) {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < k; i += 2) {
      const ax = p[i], ay = p[i + 1], bx = p[(i + 2) % k], by = p[(i + 3) % k];
      if ((ay <= y && by > y) || (by <= y && ay > y)) {
        const x = ax + (y - ay) * (bx - ax) / (by - ay);
        if (x < lo) lo = x; if (x > hi) hi = x;
      }
    }
    if (lo <= hi) {
      const x1 = Math.max(0, Math.ceil(lo)), x2 = Math.min(W - 1, Math.floor(hi));
      if (x2 >= x1) { L[n++] = y; L[n++] = x1; L[n++] = x2; }
    }
  }
  return n;
}
const scan = s => s.t === 'circle' ? scanCircle(s) : scanPoly(pts(s));

function evaluate(s) {
  const n = scan(s); if (n === 0) return null;
  const ia = 1 - A; let sr = 0, sg = 0, sb = 0, cnt = 0;
  for (let k = 0; k < n; k += 3) {
    const row = L[k] * W;
    for (let x = L[k + 1]; x <= L[k + 2]; x++) {
      const i = row + x, t = i * 4, c = i * 3;
      sr += T[t] - C[c] * ia; sg += T[t + 1] - C[c + 1] * ia; sb += T[t + 2] - C[c + 2] * ia; cnt++;
    }
  }
  if (cnt < 3) return null;
  let r = clamp(sr / cnt / A), g = clamp(sg / cnt / A), b = clamp(sb / cnt / A);
  if (GRAY) { const m = (r + g + b) / 3; r = g = b = m; }
  let d = 0;
  for (let k = 0; k < n; k += 3) {
    const row = L[k] * W;
    for (let x = L[k + 1]; x <= L[k + 2]; x++) {
      const i = row + x, t = i * 4, c = i * 3;
      const o0 = C[c], o1 = C[c + 1], o2 = C[c + 2];
      const n0 = o0 * ia + r * A, n1 = o1 * ia + g * A, n2 = o2 * ia + b * A;
      const e0 = T[t] - n0, e1 = T[t + 1] - n1, e2 = T[t + 2] - n2;
      const f0 = T[t] - o0, f1 = T[t + 1] - o1, f2 = T[t + 2] - o2;
      d += e0 * e0 + e1 * e1 + e2 * e2 - f0 * f0 - f1 * f1 - f2 * f2;
    }
  }
  return { d, r, g, b };
}

function randShape(p) {
  const t = TYPES[(rnd() * TYPES.length) | 0];
  const S = Math.min(W, H), maxR = Math.max(1.6, S * 0.42 * Math.pow(1 - p, 1.8) + S * 0.012);
  const [x, y] = (p < 0.04 || rnd() < 0.15) ? [rnd() * W, rnd() * H] : samplePos();
  if (t === 'circle') return { t, x, y, r: 0.8 + rnd() * maxR };
  if (t === 'tri') {
    const p6 = []; for (let i = 0; i < 3; i++) { const a = rnd() * 6.283, rr = maxR * (0.3 + rnd() * 0.9); p6.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    return { t, p: p6 };
  }
  const thin = rnd() < 0.3;
  return { t, x, y, w: 1.2 + rnd() * maxR * 1.8, h: thin ? 0.8 + rnd() * 1.6 : 1.2 + rnd() * maxR * 1.6, a: rnd() * Math.PI };
}
function mutate(s) {
  const m = Math.max(1, s._m || 4), j = () => (rnd() - 0.5) * 2 * m;
  if (s.t === 'circle') {
    const o = { ...s }; if (rnd() < 0.5) { o.x += j(); o.y += j(); } else o.r = Math.max(0.7, o.r + j() * 0.6); return o;
  }
  if (s.t === 'tri') { const p = s.p.slice(), i = ((rnd() * 3) | 0) * 2; p[i] += j(); p[i + 1] += j(); return { t: 'tri', p, _m: s._m }; }
  const o = { ...s }; const q = rnd();
  if (q < 0.35) { o.x += j(); o.y += j(); } else if (q < 0.7) { o.w = Math.max(0.8, o.w + j()); o.h = Math.max(0.8, o.h + j()); } else o.a += (rnd() - 0.5) * 0.5;
  return o;
}
function apply(s, e) {
  const n = scan(s), ia = 1 - A;
  for (let k = 0; k < n; k += 3) {
    const row = L[k] * W;
    for (let x = L[k + 1]; x <= L[k + 2]; x++) {
      const c = (row + x) * 3; C[c] = C[c] * ia + e.r * A; C[c + 1] = C[c + 1] * ia + e.g * A; C[c + 2] = C[c + 2] * ia + e.b * A;
    }
  }
}
function round(s) {
  const q = v => Math.round(v * 100) / 100;
  if (s.t === 'circle') return { t: 'circle', x: q(s.x), y: q(s.y), r: q(s.r) };
  if (s.t === 'tri') return { t: 'tri', p: s.p.map(q) };
  return { t: 'rect', p: pts(s).map(q), x: q(s.x), y: q(s.y) };
}

onmessage = ev => {
  const d = ev.data;
  W = d.w; H = d.h; A = d.alpha; TYPES = d.types; GRAY = d.gray; T = d.pixels;
  if (GRAY) for (let i = 0; i < W * H; i++) { const t = i * 4, m = 0.299 * T[t] + 0.587 * T[t + 1] + 0.114 * T[t + 2]; T[t] = T[t + 1] = T[t + 2] = m; }
  let mr = 0, mg = 0, mb = 0; const NP = W * H;
  for (let i = 0; i < NP; i++) { mr += T[i * 4]; mg += T[i * 4 + 1]; mb += T[i * 4 + 2]; }
  const bg = [mr / NP, mg / NP, mb / NP].map(Math.round);
  C = new Float32Array(NP * 3);
  for (let i = 0; i < NP; i++) { C[i * 3] = bg[0]; C[i * 3 + 1] = bg[1]; C[i * 3 + 2] = bg[2]; }
  postMessage({ type: 'bg', color: bg });
  const CAND = d.cand || 150, MUT = d.mut || 80, A0 = d.alpha;
  buildErrorMap();
  for (let k = 0; k < d.count; k++) {
    const prog = k / d.count;
    A = Math.min(0.92, A0 + 0.4 * Math.pow(prog, 1.3));
    if (k % 12 === 0) buildErrorMap();
    let best = null, bs = null;
    const mstep = Math.max(1, Math.min(W, H) / 22 * Math.pow(1 - prog, 1.2));
    for (let i = 0; i < CAND; i++) { const s = randShape(prog); s._m = mstep; const e = evaluate(s); if (e && (!best || e.d < best.d)) { best = e; bs = s; } }
    if (!best) continue;
    let fails = 0, iter = 0;
    while (fails < MUT && iter < MUT * 5) {
      iter++; const s2 = mutate(bs), e = evaluate(s2);
      if (e && e.d < best.d) { best = e; bs = s2; fails = 0; } else fails++;
    }
    apply(bs, best);
    postMessage({ type: 'shape', i: k, a: Math.round(A * 100) / 100, shape: round(bs), color: [Math.round(best.r), Math.round(best.g), Math.round(best.b)] });
  }
  let se = 0; for (let i = 0; i < W * H; i++) for (let c = 0; c < 3; c++) { const d = T[i * 4 + c] - C[i * 3 + c]; se += d * d; }
  postMessage({ type: 'done', rmse: Math.sqrt(se / (W * H * 3)) });
};
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const sheet = $('sheet'), fillsG = $('fills'), guidesG = $('guides');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BLUE = '#2A62D6', MARK = '#D9482B', ALPHA = 0.5;
  const SPEED = { 1: ['천천히', 150, 1100], 2: ['느리게', 90, 800], 3: ['보통', 45, 560], 4: ['빠르게', 18, 360], 5: ['순식간', 4, 200] };

  let W = 200, H = 200, worker = null, shapes = [], total = 0, computed = 0, drawn = 0;
  let queue = [], nextAt = 0, runId = 0, sourceCanvas = null, isSample = true, done = false, bg = [255, 255, 255];

  const workerURL = URL.createObjectURL(new Blob([$('workerSrc').textContent], { type: 'text/javascript' }));

  function settings() {
    const types = [...document.querySelectorAll('#types input:checked')].map(i => i.value);
    return {
      types: types.length ? types : ['circle'],
      style: document.querySelector('input[name=style]:checked').value,
      count: +$('count').value,
      side: 420,
      speed: +$('speed').value,
      keep: $('keepGuides').checked,
    };
  }

  // ---------- sample image ----------
  function sampleCanvas() {
    const c = document.createElement('canvas'); c.width = 600; c.height = 600; const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, 380); sky.addColorStop(0, '#2B4C8C'); sky.addColorStop(0.55, '#E7896B'); sky.addColorStop(1, '#F6C87A');
    g.fillStyle = sky; g.fillRect(0, 0, 600, 600);
    g.fillStyle = '#FFE7A8'; g.beginPath(); g.arc(380, 300, 78, 0, 7); g.fill();
    g.fillStyle = '#5C3F63'; g.beginPath(); g.moveTo(0, 380); g.lineTo(140, 230); g.lineTo(260, 330); g.lineTo(360, 250); g.lineTo(600, 390); g.lineTo(600, 600); g.lineTo(0, 600); g.fill();
    g.fillStyle = '#2E2547'; g.beginPath(); g.moveTo(0, 430); g.lineTo(200, 330); g.lineTo(420, 440); g.lineTo(600, 360); g.lineTo(600, 600); g.lineTo(0, 600); g.fill();
    const sea = g.createLinearGradient(0, 470, 0, 600); sea.addColorStop(0, '#3E6FA8'); sea.addColorStop(1, '#1C2F55');
    g.fillStyle = sea; g.fillRect(0, 470, 600, 130);
    g.fillStyle = 'rgba(255,231,168,.55)'; for (let i = 0; i < 6; i++) g.fillRect(330 - i * 6, 485 + i * 18, 100 + i * 12, 5);
    return c;
  }

  function drawThumb(src) {
    const t = $('thumb'), g = t.getContext('2d'), s = Math.min(src.width, src.height);
    g.clearRect(0, 0, 128, 128);
    g.drawImage(src, (src.width - s) / 2, (src.height - s) / 2, s, s, 0, 0, 128, 128);
  }

  // ---------- run ----------
  function start() {
    if (!sourceCanvas) return;
    const st = settings();
    runId++; if (worker) worker.terminate();
    const sc = st.side / Math.max(sourceCanvas.width, sourceCanvas.height);
    W = Math.max(8, Math.round(sourceCanvas.width * sc)); H = Math.max(8, Math.round(sourceCanvas.height * sc));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(sourceCanvas, 0, 0, W, H);
    const pixels = g.getImageData(0, 0, W, H).data;

    shapes = []; total = st.count; computed = 0; drawn = 0; done = false;
    resetSheet();
    introLines();
    worker = new Worker(workerURL);
    const myRun = runId;
    worker.onmessage = e => {
      if (myRun !== runId) return;
      if (e.data.type === 'bg') { bg = e.data.color; queue.push({ bg: true }); }
      else if (e.data.type === 'shape') { shapes.push(e.data); computed++; queue.push(e.data); }
      else { done = true; }
      ticker();
    };
    worker.postMessage({ w: W, h: H, pixels, alpha: ALPHA, types: st.types, gray: st.style !== 'color', count: st.count }, [pixels.buffer]);
    ticker();
  }

  function replay() {
    runId++;
    const keep = shapes.slice();
    resetSheet(); introLines();
    drawn = 0; queue = [{ bg: true }, ...keep]; computed = keep.length; done = computed >= total;
    ticker();
  }

  function resetSheet() {
    sheet.setAttribute('viewBox', `0 0 ${W} ${H}`);
    for (const id of ['paper', 'frame']) { $(id).setAttribute('width', W); $(id).setAttribute('height', H); }
    $('frame').setAttribute('stroke-width', W / 500);
    $('paper').getAnimations().forEach(a => a.cancel()); $('paper').setAttribute('fill', '#FFFFFF');
    fillsG.replaceChildren(); guidesG.replaceChildren(); queue = []; nextAt = 0;
  }

  // ---------- drawing ----------
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const sw = () => W / 420;
  const perim = p => { let s = 0; for (let i = 0; i < p.length; i += 2) s += Math.hypot(p[(i + 2) % p.length] - p[i], p[(i + 3) % p.length] - p[i + 1]); return s; };
  const pstr = p => { let s = ''; for (let i = 0; i < p.length; i += 2) s += p[i] + ',' + p[i + 1] + ' '; return s; };

  function drawLine(x1, y1, x2, y2, dur, delay, endOp) {
    const len = Math.hypot(x2 - x1, y2 - y1);
    const ln = el('line', { x1, y1, x2, y2, stroke: BLUE, 'stroke-width': sw(), 'stroke-dasharray': `${len} ${len}`, 'stroke-dashoffset': len });
    guidesG.appendChild(ln);
    if (reduced) { ln.setAttribute('stroke-dashoffset', 0); ln.style.opacity = endOp; return; }
    ln.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, delay, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' });
    ln.animate([{ opacity: 1 }, { opacity: endOp }], { duration: 600, delay: delay + dur + 200, fill: 'forwards' });
  }
  function introLines() {
    const d = reduced ? 0 : 700;
    drawLine(0, H / 2, W, H / 2, d, 0, 0.18);
    drawLine(W / 2, 0, W / 2, H, d, 120, 0.18);
    drawLine(0, 0, W, H, d, 240, 0.1);
    drawLine(W, 0, 0, H, d, 360, 0.1);
    nextAt = performance.now() + (reduced ? 0 : 700);
  }

  const density = () => Math.min(1, Math.sqrt(300 / Math.max(1, total)));
  function paintBg() {
    const p = $('paper'), to = `rgb(${bg.join(',')})`, d = reduced ? 0 : 900;
    p.animate([{ fill: '#FFFFFF' }, { fill: to }], { duration: d, easing: 'ease-out', fill: 'forwards' });
    nextAt = performance.now() + d * 0.6;
  }
  function drawShape(item) {
    if (item.bg) return paintBg();
    const st = settings(), dur = SPEED[st.speed][2] * (total > 600 ? 0.75 : 1), s = item.shape;
    const col = `rgb(${item.color.join(',')})`, line = st.style === 'line';
    let fill, guide, len, extras = [];
    if (s.t === 'circle') {
      fill = el('circle', { cx: s.x, cy: s.y, r: s.r });
      guide = el('circle', { cx: s.x, cy: s.y, r: s.r, transform: `rotate(-90 ${s.x} ${s.y})` });
      len = 2 * Math.PI * s.r;
      const k = Math.min(s.r * 0.35, W / 60);
      extras.push(el('path', { d: `M${s.x - k},${s.y}h${2 * k}M${s.x},${s.y - k}v${2 * k}`, stroke: MARK, 'stroke-width': sw(), fill: 'none' }));
    } else {
      fill = el('polygon', { points: pstr(s.p) });
      guide = el('polygon', { points: pstr(s.p) });
      len = perim(s.p);
      for (let i = 0; i < s.p.length; i += 2) extras.push(el('circle', { cx: s.p[i], cy: s.p[i + 1], r: W / 260, fill: MARK }));
    }
    const fillOp = line ? 0 : (item.a || ALPHA);
    fill.setAttribute('fill', col); fill.setAttribute('fill-opacity', fillOp); fill.style.opacity = 0;
    const gColor = line ? col : BLUE, gWidth = line ? sw() * 1.6 : sw();
    guide.setAttribute('fill', 'none'); guide.setAttribute('stroke', gColor); guide.setAttribute('stroke-width', gWidth);
    guide.setAttribute('stroke-dasharray', `${len} ${len}`); guide.setAttribute('stroke-dashoffset', len);
    fillsG.appendChild(fill); guidesG.appendChild(guide); extras.forEach(e => guidesG.appendChild(e));
    const guideEnd = line ? 0.85 * density() : (st.keep ? 0.16 * density() : 0);

    if (reduced) {
      fill.style.opacity = 1; guide.setAttribute('stroke-dashoffset', 0); guide.style.opacity = guideEnd; extras.forEach(e => e.remove());
      return;
    }
    guide.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, easing: 'cubic-bezier(.55,0,.25,1)', fill: 'forwards' });
    extras.forEach(e => e.animate([{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.75 }, { opacity: 0 }], { duration: dur * 1.6, fill: 'forwards' }));
    fill.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur * 0.6, delay: dur * 0.75, fill: 'forwards' });
    guide.animate([{ opacity: 1 }, { opacity: guideEnd }], { duration: dur * 0.8, delay: dur * 1.1, fill: 'forwards' });
    setTimeout(() => extras.forEach(e => e.remove()), dur * 1.7);
  }

  function tick(now) {
    const st = settings(), gap = SPEED[st.speed][1] * Math.min(1, 300 / Math.max(1, total));
    let n = 0;
    while (queue.length && now >= nextAt && n < 8) {
      const it = queue.shift(); drawShape(it); if (!it.bg) drawn++; n++;
      nextAt = (nextAt || now) + gap; if (gap === 0 || reduced) nextAt = now;
    }
    if (n) ticker();
    if (!queue.length && nextAt < now) nextAt = now;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function ticker() {
    const pct = total ? drawn / total : 0;
    $('barI').style.width = (pct * 100).toFixed(1) + '%';
    let msg;
    if (drawn >= total && done) msg = `완성 · 도형 ${total}개`;
    else if (computed > drawn + 3 || done) msg = `그리는 중 · ${drawn} / ${total}`;
    else msg = `계산하며 그리는 중 · ${drawn} / ${total}`;
    $('ticker').textContent = msg;
  }

  // ---------- export ----------
  function exportSVG() {
    const st = settings(), line = st.style === 'line';
    const gOp = line ? 0.85 * density() : (st.keep ? 0.16 * density() : 0), w = sw();
    let body = '';
    for (const it of shapes) {
      const s = it.shape, col = `rgb(${it.color.join(',')})`;
      const geo = s.t === 'circle' ? `<circle cx="${s.x}" cy="${s.y}" r="${s.r}"` : `<polygon points="${pstr(s.p).trim()}"`;
      if (!line) body += `${geo} fill="${col}" fill-opacity="${it.a || ALPHA}"/>`;
    }
    if (gOp > 0) {
      body += `<g fill="none" stroke-opacity="${gOp}">`;
      for (const it of shapes) {
        const s = it.shape, stroke = line ? `rgb(${it.color.join(',')})` : BLUE, width = line ? w * 1.6 : w;
        body += s.t === 'circle' ? `<circle cx="${s.x}" cy="${s.y}" r="${s.r}" stroke="${stroke}" stroke-width="${width}"/>` : `<polygon points="${pstr(s.p).trim()}" stroke="${stroke}" stroke-width="${width}"/>`;
      }
      body += '</g>';
    }
    return `<svg xmlns="${NS}" viewBox="0 0 ${W} ${H}" width="${W * 4}" height="${H * 4}"><rect width="${W}" height="${H}" fill="rgb(${bg.join(',')})"/>${body}</svg>`;
  }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }

  $('saveBtn').onclick = () => {
    if (!shapes.length) return toast('아직 그린 도형이 없어요');
    const img = new Image();
    img.onload = () => {
      const k = Math.max(4, Math.round(2400 / Math.max(W, H))), c = document.createElement('canvas'); c.width = W * k; c.height = H * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      $('outImg').src = c.toDataURL('image/png'); $('overlay').hidden = false;
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(exportSVG());
  };
  $('closeOv').onclick = () => $('overlay').hidden = true;
  $('overlay').onclick = e => { if (e.target.id === 'overlay') $('overlay').hidden = true; };
  $('copyBtn').onclick = async () => {
    if (!shapes.length) return toast('아직 그린 도형이 없어요');
    const svg = exportSVG();
    try { await navigator.clipboard.writeText(svg); toast('SVG 코드를 복사했어요'); }
    catch { const ta = document.createElement('textarea'); ta.value = svg; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('SVG 코드를 복사했어요'); } catch { toast('복사하지 못했어요'); } ta.remove(); }
  };

  // ---------- inputs ----------
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return toast('이미지 파일만 쓸 수 있어요');
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), s = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      sourceCanvas = c; isSample = false; drawThumb(c);
      $('origNote').textContent = file.name.length > 28 ? file.name.slice(0, 26) + '…' : file.name;
      start();
    };
    img.onerror = () => toast('이 이미지는 열 수 없어요');
    img.src = url;
  }
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  const desk = $('desk');
  desk.addEventListener('dragover', e => { e.preventDefault(); desk.classList.add('drag'); });
  desk.addEventListener('dragleave', () => desk.classList.remove('drag'));
  desk.addEventListener('drop', e => { e.preventDefault(); desk.classList.remove('drag'); loadFile(e.dataTransfer.files[0]); });
  document.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])][0]; if (f) loadFile(f); });

  $('sampleBtn').onclick = () => {
    sourceCanvas = sampleCanvas(); isSample = true; drawThumb(sourceCanvas);
    $('origNote').textContent = '예시 이미지예요. 사진을 올리거나 이 칸에 끌어다 놓으세요.'; start();
  };
  $('replayBtn').onclick = () => shapes.length ? replay() : start();

  let deb;
  const recompute = () => { clearTimeout(deb); deb = setTimeout(start, 350); };
  document.querySelectorAll('#types input, input[name=style]').forEach(i => i.addEventListener('change', () => {
    if (!document.querySelector('#types input:checked')) { i.checked = true; return toast('도형을 하나 이상 골라 주세요'); }
    recompute();
  }));
  $('count').oninput = () => { $('countV').textContent = $('count').value; };
  $('count').onchange = recompute;
  $('speed').oninput = () => { $('speedV').textContent = SPEED[$('speed').value][0]; };
  $('keepGuides').onchange = () => { if (shapes.length) replay(); };

  sourceCanvas = sampleCanvas(); drawThumb(sourceCanvas); start();
})();
</script>

</body>
</html>
